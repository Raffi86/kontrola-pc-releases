<style>
:root{
  --bg:#ECEFE6; --paper:#F7F8F2; --ink:#1F2B22; --muted:#5B6A5D; --line:#CBD3C4;
  --accent:#8A6A1F; --accent-ink:#fff; --leaf:#2F5D3A; --good:#2E7D4A; --bad:#B2412F; --chip:#E1E7D8;
  --display:"Alegreya SC", Georgia, serif; --body:"Alegreya Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141A16; --paper:#1C241F; --ink:#E6EADF; --muted:#9AA897; --line:#33402F;
  --accent:#D4AE52; --accent-ink:#1A1408; --leaf:#7DB58A; --good:#6BC48A; --bad:#E57A66; --chip:#26322A; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto}
header{padding-top:22px}
h1{font-family:var(--display);font-size:1.9rem;line-height:1.1;margin:0}
.sub{color:var(--muted);margin:6px 0 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.btn{font:700 1rem var(--body);padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rules{margin:10px 0 0;padding-left:20px}
.rules li{margin:4px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .25s}
.tag{display:inline-block;background:var(--chip);color:var(--leaf);font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:999px}
.q{font-weight:700;font-size:1.15rem;margin:10px 0 14px;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:400 1.02rem var(--body);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--bg))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.fb{margin:12px 0 0;font-weight:700}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.big{font-family:var(--display);font-size:3rem;color:var(--accent);margin:0;line-height:1}
.grade{font-size:1.2rem;margin:6px 0 0}
.mins{font-size:1.25rem;font-weight:700;color:var(--leaf);margin:10px 0 0}
.code{font:700 2rem ui-monospace,Consolas,monospace;letter-spacing:4px;background:var(--bg);border:2px dashed var(--accent);border-radius:12px;padding:12px;text-align:center;margin:12px 0 6px;user-select:all}
.muted{color:var(--muted);font-size:.92rem}
.mist{margin:8px 0 0;padding:0;list-style:none}
.mist li{border-top:1px dashed var(--line);padding:8px 0}
.mist b{color:var(--good)}
table{width:100%;border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums}
td{padding:4px 0;border-top:1px solid var(--line)}
td:last-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const PER_TEST = 20, MIN_PER_OK = 2;
const RW_SECRET = "UNBEEH77DTX8PNJCNKWCH35N3YKKBET3", ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const CH = ["Cała część I","Nieproszeni goście","Pieczeń barania","Krótki odpoczynek","Górą i dołem","Zagadki w ciemnościach","Z deszczu pod rynnę","Dziwna kwatera","Muchy i pająki","Beczki na wolności"];
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("hobtest_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("hobtest_" + k, JSON.stringify(v)); } catch (e) {} }
};
const day = ts => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

/* SHA-256 – także gdy przeglądarka nie daje crypto.subtle (plik otwarty z telefonu) */
async function sha256(bytes) {
  try { if (window.crypto && crypto.subtle) return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)); } catch (e) {}
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
  m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(n - 4, l * 8); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  const w = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < n; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = r(w[i-15], 7) ^ r(w[i-15], 18) ^ (w[i-15] >>> 3), s1 = r(w[i-2], 17) ^ r(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  const out = new Uint8Array(32), ov = new DataView(out.buffer);
  H.forEach((x, i) => ov.setUint32(i * 4, x));
  return out;
}
/* Kod z minutami dla Kontroli PC: 4 losowe + znak minut + 4 kontrolne */
async function rewardCode(minutes) {
  const r = new Uint8Array(4); crypto.getRandomValues(r);
  const nonce = Array.from(r, b => ABC[b % 32]).join("");
  const m = ABC[Math.min(31, Math.floor(minutes / MIN_PER_OK))];
  const h = await sha256(new TextEncoder().encode(RW_SECRET + "|" + day(Date.now()) + "|" + nonce + "|" + m));
  return nonce + m + "-" + [0, 1, 2, 3].map(i => ABC[h[i] % 32]).join("");
}

function grade(p) { return p >= 100 ? [6, "celujący"] : p >= 90 ? [5, "bardzo dobry"] : p >= 75 ? [4, "dobry"] : p >= 50 ? [3, "dostateczny"] : p >= 30 ? [2, "dopuszczający"] : [1, "niedostateczny"]; }

/* Losowanie: po jednym pytaniu z każdego rozdziału, reszta losowo; unikamy pytań z poprzedniego testu */
function pickQuestions() {
  const last = new Set(store.get("last", []));
  const ids = BANK.map((_, i) => i);
  const fresh = ids.filter(i => !last.has(i));
  const pool = fresh.length >= PER_TEST + 10 ? fresh : ids;
  const chosen = new Set();
  for (let ch = 1; ch <= 9; ch++) {
    const c = shuffle(pool.filter(i => BANK[i][0] === ch));
    if (c.length) chosen.add(c[0]);
  }
  for (const i of shuffle(pool)) { if (chosen.size >= PER_TEST) break; chosen.add(i); }
  const list = shuffle([...chosen]);
  store.set("last", list);
  return list;
}

let T = null; // bieżący test

function home() {
  const hist = store.get("hist", []);
  const best = hist.reduce((m, h) => Math.max(m, h.ok), 0);
  app.innerHTML = `
  <section class="card">
    <h2 style="font-family:var(--display);margin:0 0 6px">Zasady</h2>
    <ul class="rules">
      <li><b>${PER_TEST} pytań</b> losowanych z bazy <b>${BANK.length}</b> – za każdym razem inne.</li>
      <li>Każda dobra odpowiedź to <b>+${MIN_PER_OK} min</b> na komputerze.</li>
      <li>Na końcu dostaniesz <b>kod</b> – wpisz go w ikonce Kontroli PC przy zegarze (prawy przycisk → „Wpisz kod nagrody”).</li>
      <li>Możesz rozwiązywać test wiele razy. Ile minut dziennie da się zdobyć, ustala tata.</li>
    </ul>
    <div class="row" style="margin-top:16px"><button class="btn pri" id="go">Zaczynam test</button></div>
  </section>
  ${hist.length ? `<section class="card"><h2 style="font-family:var(--display);margin:0 0 6px">Twoje wyniki</h2>
    <p class="muted">Najlepszy wynik: <b>${best}/${PER_TEST}</b></p>
    <table>${hist.slice(-8).reverse().map(h => `<tr><td>${esc(new Date(h.t).toLocaleString("pl-PL", {day:"numeric", month:"numeric", hour:"2-digit", minute:"2-digit"}))}</td><td>${h.ok}/${PER_TEST} · ocena ${h.g} · +${h.ok * MIN_PER_OK} min</td></tr>`).join("")}</table></section>` : ""}`;
  $("#go").onclick = start;
}

function start() {
  T = { list: pickQuestions(), i: 0, ok: 0, wrong: [] };
  question();
}

function question() {
  const id = T.list[T.i], q = BANK[id], tf = typeof q[2] === "boolean";
  const opts = tf ? [["Prawda", q[2] === true], ["Fałsz", q[2] === false]] : shuffle([[q[2], true], [q[3], false], [q[4], false], [q[5], false]]);
  app.innerHTML = `
  <section class="card">
    <div class="top"><span>Pytanie ${T.i + 1} z ${T.list.length}</span><span>dobrze: ${T.ok} · +${T.ok * MIN_PER_OK} min</span></div>
    <div class="bar"><i style="width:${T.i / T.list.length * 100}%"></i></div>
    <span class="tag">${q[0] ? "Rozdział " + q[0] + " · " + esc(CH[q[0]]) : esc(CH[0])}</span>
    <p class="q">${tf ? "Prawda czy fałsz? " : ""}${esc(q[1])}</p>
    <div class="opts${tf ? " tf" : ""}">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o[0])}</button>`).join("")}</div>
    <div id="after"></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k, good = opts[k][1];
    app.querySelectorAll(".opt").forEach((x, j) => { x.disabled = true; if (opts[j][1]) x.classList.add("ok"); });
    if (good) T.ok++; else { b.classList.add("no"); T.wrong.push({ q: q[1], a: tf ? (q[2] ? "Prawda" : "Fałsz") : q[2], tf }); }
    const last = T.i + 1 >= T.list.length;
    $("#after").innerHTML = `<p class="fb ${good ? "ok" : "no"}">${good ? "Dobrze! +" + MIN_PER_OK + " min" : "Niestety, to nie to."}</p>
      <div class="row" style="margin-top:12px"><button class="btn pri" id="next">${last ? "Zobacz wynik" : "Dalej →"}</button></div>`;
    $("#next").onclick = () => { T.i++; last ? result() : question(); };
    $("#next").focus();
  });
}

async function result() {
  const pct = Math.round(T.ok / T.list.length * 100);
  const [g, gname] = grade(pct);
  const minutes = T.ok * MIN_PER_OK;
  const hist = store.get("hist", []); hist.push({ t: Date.now(), ok: T.ok, g }); store.set("hist", hist.slice(-50));
  let code = "";
  if (minutes > 0) { try { code = await rewardCode(minutes); } catch (e) { code = ""; } }
  app.innerHTML = `
  <section class="card">
    <p class="big">${T.ok}/${T.list.length}</p>
    <p class="grade">Ocena: <b>${g} – ${gname}</b> (${pct}%)</p>
    <p class="mins">Zdobyte minuty: +${minutes} min</p>
    ${code ? `<div class="code" id="code">${code}</div>
      <p class="muted">Wpisz ten kod w ikonce Kontroli PC przy zegarze (prawy przycisk → „Wpisz kod nagrody”). Kod działa tylko dzisiaj i tylko raz.</p>
      <div class="row"><button class="btn" id="copy">Kopiuj kod</button></div>`
      : `<p class="muted">Tym razem bez minut – spróbuj jeszcze raz!</p>`}
    <div class="row" style="margin-top:16px"><button class="btn pri" id="again">Nowy test</button><button class="btn" id="home">Wyniki</button></div>
  </section>
  ${T.wrong.length ? `<section class="card"><h2 style="font-family:var(--display);margin:0">Do poprawki (${T.wrong.length})</h2>
    <ul class="mist">${T.wrong.map(w => `<li>${esc(w.q)}<br>Dobra odpowiedź: <b>${esc(w.a)}</b></li>`).join("")}</ul></section>` : `<section class="card"><b>Bezbłędnie! 🏆</b></section>`}`;
  $("#again").onclick = start;
  $("#home").onclick = home;
  const c = $("#copy");
  if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(code); c.textContent = "Skopiowano ✓"; } catch (e) { c.textContent = "Zaznacz kod i skopiuj"; } };
  window.scrollTo({ top: 0 });
}

home();
