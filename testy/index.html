<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Testy</title>
<style>
  :root{--a:#4f46e5;--a2:#eef2ff;--ok:#16a34a;--bad:#dc2626;--t:#1b1b23;--m:#6b7280;--bg:#f5f6fb;--card:#fff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 40px}
  h1{font-size:26px;margin:0 0 4px}
  h2{font-size:19px;margin:0 0 6px}
  .muted{color:var(--m)}
  .card{background:var(--card);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 3px #0001}
  .pill{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--a2);color:var(--a);font-weight:600;font-size:13px;margin:6px 6px 0 0}
  .pill.warn{background:#fef3c7;color:#92400e}
  .pill.ok{background:#dcfce7;color:#166534}
  button{font:inherit;cursor:pointer;border:0;border-radius:14px}
  .btn{background:var(--a);color:#fff;padding:13px 20px;font-weight:700;font-size:16px}
  .btn.light{background:var(--a2);color:var(--a)}
  .btn.wide{width:100%;margin-top:12px}
  .bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0 14px}
  .bar>div{height:100%;background:var(--a);transition:width .3s}
  .q{font-size:21px;font-weight:700;line-height:1.35;margin:6px 0 16px}
  .answers{display:grid;gap:10px}
  .answers.pf{grid-template-columns:1fr 1fr}
  .ans{position:relative;overflow:hidden;background:#fff;border:2px solid #e5e7eb;padding:15px 16px;text-align:left;font-size:17px;font-weight:600;color:var(--t)}
  .answers.pf .ans{text-align:center;font-size:20px;padding:20px 8px}
  .ans:disabled{color:#9ca3af}
  .ans .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--a);width:0}
  .big{font-size:52px;font-weight:800;margin:4px 0}
  .reward{font-size:24px;font-weight:800}
  .mist{border-left:4px solid var(--bad);padding:8px 12px;margin:10px 0;background:#fef2f2;border-radius:8px}
  .center{text-align:center}
  .spin{display:inline-block;width:16px;height:16px;border:3px solid #c7d2fe;border-top-color:var(--a);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Ładowanie…</p></div>
<script>
/* Testy z lektur na telefonie syna. Wyniki trafiają do jego skrzynki w Firebase,
   komputer (Kontrola PC) sprawdza je i sam dolicza czas – bez kodów. */
const FB = "https://kontrola-pc-default-rtdb.europe-west1.firebasedatabase.app";
const WAIT_MS = 2000;
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const fmtSec = s => s % 60 === 0 ? `${s / 60} min` : s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60} s`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("kpct_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("kpct_" + k, JSON.stringify(v)); } catch (e) {} },
};

let box = new URLSearchParams(location.search).get("s") || store.get("box", "");
if (box) store.set("box", box);
if (location.search) history.replaceState(null, "", location.pathname + "?s=" + encodeURIComponent(box));
const url = p => `${FB}/rodziny/${encodeURIComponent(box)}/${p}.json`;
let K = null, T = null;

async function answerHash(id, text) {
  const b = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`kpc1|${id}|${text}`)));
  return [...b].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 16);
}

async function getJson(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }

function dateLabel(d) {
  if (!d) return "";
  const t = new Date(d + "T12:00:00"), now = new Date(); now.setHours(12, 0, 0, 0);
  const days = Math.round((t - now) / 86400000);
  const txt = t.toLocaleDateString("pl-PL", { weekday: "short", day: "numeric", month: "numeric" });
  return days < 0 ? `termin minął (${txt})` : days === 0 ? "termin: dziś!" : days === 1 ? "termin: jutro" : `termin: ${txt}`;
}

async function home() {
  T = null;
  if (!box || box.length < 20) {
    app.innerHTML = `<h1>📚 Testy</h1><div class="card"><h2>Brak linku</h2><p class="muted">Otwórz link, który wysłał Ci tata.</p></div>`;
    return;
  }
  app.innerHTML = `<p class="muted"><span class="spin"></span>Ładowanie…</p>`;
  let st = null, allStats = null;
  try { [K, st, allStats] = await Promise.all([getJson(url("konfig")), getJson(url("stan")).catch(() => null), getJson(url("statystyki")).catch(() => null)]); }
  catch (e) { app.innerHTML = `<h1>📚 Testy</h1><div class="card"><h2>Brak internetu</h2><p class="muted">Sprawdź połączenie i spróbuj jeszcze raz.</p><button class="btn wide" onclick="home()">Spróbuj ponownie</button></div>`; return; }
  if (!K) { app.innerHTML = `<h1>📚 Testy</h1><div class="card"><h2>Ten link już nie działa</h2><p class="muted">Poproś tatę o nowy link.</p></div>`; return; }
  const left = st && Date.now() - (st.czas || 0) < 6 * 3600_000 ? st.pozostalo : null;
  const best = store.get("best", {});
  app.innerHTML = `<h1>📚 Cześć${K.imie ? ", " + esc(K.imie) : ""}!</h1>
    <p class="muted">Za dobrą odpowiedź <b>+${fmtSec(K.sekundy)}</b>${K.minus > 0 ? `, za złą <b>−${K.minus} s</b>` : ""} ${K.cel === "gry" ? "na gry" : "przy komputerze"}.
    Nagroda od <b>${K.prog}%</b>${K.komplet > 0 ? `, za komplet <b>+${K.komplet} min</b>` : ""}${K.rekord > 0 ? `, za rekord <b>+${K.rekord} min</b>` : ""}.
    Czas doliczy się sam na komputerze.</p>
    ${left != null ? `<span class="pill ${left > 0 ? "ok" : "warn"}">${left > 0 ? `Dziś możesz jeszcze zdobyć: ${fmtSec(left)}` : "Dzisiejsze maksimum zdobyte"}</span>` : `<span class="pill">Najwięcej dziennie: ${K.max} min</span>`}
    ${(K.testy || []).map(t => `<div class="card"><h2>${esc(t.nazwa)}</h2><div class="muted">${esc(t.opis)}</div>
      <span class="pill">${t.pytan} pytań</span>${best[t.id] != null ? `<span class="pill">Rekord: ${best[t.id]}/${t.pytan}</span>` : ""}${t.termin ? `<span class="pill warn">${esc(dateLabel(t.termin))}</span>` : ""}
      <button class="btn wide" data-id="${esc(t.id)}">Start</button>
      ${hardCount(allStats, t.id) >= 5 ? `<button class="btn light wide" data-id="${esc(t.id)}" data-hard="1">Trening: moje trudne (${hardCount(allStats, t.id)})</button>
      <button class="btn light wide" data-list="${esc(t.id)}">Pokaż moje trudne</button>` : ""}</div>`).join("") || `<div class="card"><h2>Brak testów</h2><p class="muted">Tata nie włączył jeszcze żadnego testu.</p></div>`}`;
  app.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => start(b.dataset.id, b, !!b.dataset.hard));
  app.querySelectorAll("button[data-list]").forEach(b => b.onclick = () => hardList(b.dataset.list, allStats));
}

const isHard = s => s && s.length >= 2 && s[1] > 0 && s[1] * 2 >= s[0];
function hardCount(all, id) { const s = all && all[id]; return s ? Object.values(s).filter(isHard).length : 0; }

async function hardList(id, all) {
  app.innerHTML = `<p class="muted"><span class="spin"></span>Ładowanie…</p>`;
  let d; try { d = await getJson(`${encodeURIComponent(id)}.json`); } catch (e) { return home(); }
  const s = (all && all[id]) || {};
  const rows = [];
  for (const q of d.pytania) {
    const x = s[q.id]; if (!isHard(x)) continue;
    const pf = q.t === "pf" || typeof q.pf === "boolean";
    const opts = pf ? ["Prawda", "Fałsz"] : q.a;
    let good = ""; for (const o of opts) if (await answerHash(q.id, o) === q.h) { good = o; break; }
    rows.push({ text: d.styl === "ortografia" ? q.q.replace(/\([^)]*\)/, good) : q.q + " → " + good, bad: x[1], ok: x[0] });
  }
  rows.sort((a, b) => (b.bad - b.ok / 2) - (a.bad - a.ok / 2));
  app.innerHTML = `<h1>Moje trudne</h1><p class="muted">${esc(d.nazwa)} – te wracają w testach częściej, dopóki ich nie opanujesz.</p>
    <div class="card">${rows.map(r => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><b style="font-size:18px">${esc(r.text)}</b><span class="muted">✘ ${r.bad} · ✔ ${r.ok}</span></div>`).join("")}</div>
    <button class="btn wide" onclick="home()">Wróć</button>`;
}

async function start(id, b, hardOnly) {
  b.disabled = true; b.innerHTML = `<span class="spin"></span>Ładowanie…`;
  let d;
  try { d = await getJson(`${encodeURIComponent(id)}.json?v=${Date.now()}`); }
  catch (e) { b.disabled = false; b.textContent = "Start"; alert("Nie udało się pobrać testu. Sprawdź internet."); return; }
  const info = (K.testy || []).find(t => t.id === id) || {};
  let n = Math.min(d.pytan || 20, d.pytania.length);
  // trudne wyrazy częściej, dobrze znane rzadziej (statystyki zapisuje komputer po każdym teście)
  let stats = {};
  try { stats = (await getJson(url("statystyki/" + encodeURIComponent(id)))) || {}; } catch (e) {}
  const today = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(2026, 0, 1).getTime()) / 86400000);
  const weight = s => {
    if (!s || s.length < 3) return 1.5;
    let w = Math.min(6, Math.max(0.2, 1 + 2 * s[1] - 0.5 * s[0]));
    const since = today - s[2];
    if (since <= 0) w *= 0.15; else if (since === 1) w *= 0.5;
    return w;
  };
  let source = d.pytania;
  if (hardOnly) { const h = d.pytania.filter(q => isHard(stats[q.id])); if (h.length >= 5) source = h; }
  const pool = source.map(q => ({ q, k: Math.pow(Math.random(), 1 / weight(stats[q.id])) }))
    .sort((a, b) => b.k - a.k).slice(0, Math.min(n, source.length)).map(x => x.q);
  // w opublikowanym teście nie ma jawnych odpowiedzi – tylko skrót dobrej (h)
  const qs = [];
  for (const q of shuffle(pool)) {
    const pf = q.t === "pf" || typeof q.pf === "boolean";
    const opts = pf ? ["Prawda", "Fałsz"] : q.a.slice();
    let dobra = "";
    if (q.h) { for (const o of opts) if (await answerHash(q.id, o) === q.h) { dobra = o; break; } }
    else dobra = pf ? (q.pf ? "Prawda" : "Fałsz") : q.a[0];
    qs.push({ id: q.id, q: q.q, r: d.rozdzialy && d.rozdzialy[q.r] || "", pf, a: pf ? opts : shuffle(opts), dobra });
  }
  T = { id, tryb: hardOnly ? "trudne" : "", nazwa: d.nazwa || info.nazwa || "", qs, i: 0, ans: [], orto: d.styl === "ortografia" || d.styl === "matematyka", gap: d.styl === "ortografia" };
  question();
}

function question() {
  const q = T.qs[T.i];
  app.innerHTML = `<div class="muted">${esc(T.nazwa)}${q.r ? " · " + esc(q.r) : ""}</div>
    <div class="bar"><div style="width:${(T.i / T.qs.length) * 100}%"></div></div>
    <div class="muted">Pytanie ${T.i + 1} z ${T.qs.length}${q.pf ? " · prawda czy fałsz?" : ""}</div>
    <div class="q" style="${T.orto ? "font-size:38px;text-align:center;letter-spacing:1px;margin:18px 0 24px" : ""}">${esc(q.q)}</div>
    <div class="answers ${q.pf || T.orto ? "pf" : ""}">${q.a.map((a, i) => `<button class="ans" data-i="${i}" disabled style="${T.orto ? "font-size:30px" : ""}">${q.pf ? (a === "Prawda" ? "✔ " : "✘ ") : T.orto ? "" : String.fromCharCode(65 + i) + ". "}${esc(a)}<span class="fill"></span></button>`).join("")}</div>
    <button class="btn light wide" id="quit">Przerwij test</button>`;
  const shown = performance.now();
  const btns = [...app.querySelectorAll(".ans")];
  btns.forEach(b => { const f = b.querySelector(".fill"); f.style.transition = `width ${WAIT_MS}ms linear`; requestAnimationFrame(() => requestAnimationFrame(() => f.style.width = "100%")); });
  setTimeout(() => btns.forEach(b => { b.disabled = false; b.querySelector(".fill").style.opacity = 0; }), WAIT_MS);
  btns.forEach(b => b.onclick = () => {
    T.ans.push({ id: q.id, odp: q.a[+b.dataset.i], ms: Math.round(performance.now() - shown) });
    T.i++;
    if (T.i < T.qs.length) question(); else finish();
  });
  $("#quit").onclick = () => { if (confirm("Przerwać test? Nie dostaniesz czasu.")) home(); };
}

async function finish() {
  const ok = T.ans.filter((a, i) => a.odp === T.qs[i].dobra).length, n = T.qs.length;
  const proc = Math.round(100 * ok / n);
  const ocena = proc >= 95 ? 6 : proc >= 85 ? 5 : proc >= 70 ? 4 : proc >= 50 ? 3 : proc >= 30 ? 2 : 1;
  const best = store.get("best", {});
  if (best[T.id] == null || ok > best[T.id]) { best[T.id] = ok; store.set("best", best); }
  const fill = (q, l) => q.replace(/\([^)]*\)/, l);
  const bad = T.qs.map((q, i) => ({ q, a: T.ans[i] })).filter(x => x.a.odp !== x.q.dobra)
    .map(x => T.gap ? { q: { ...x.q, q: fill(x.q.q, "…"), dobra: fill(x.q.q, x.q.dobra) }, a: { ...x.a, odp: fill(x.q.q, x.a.odp) } } : x);
  app.innerHTML = `<div class="card center">
      <div class="muted">${esc(T.nazwa)}</div>
      <div class="big">${ok}/${n}</div>
      <div><span class="pill">${proc}%</span><span class="pill ${proc >= 50 ? "ok" : "warn"}">ocena ${ocena}</span></div>
      <p class="reward" id="rw"><span class="spin"></span>Wysyłam wynik…</p>
      <p class="muted" id="rwi"></p>
    </div>
    ${bad.length ? `<div class="card"><h2>Do poprawy (${bad.length})</h2>${bad.map(x => `<div class="mist"><b>${esc(x.q.q)}</b><br>Twoja: ${esc(x.a.odp)}<br>Dobra: <b style="color:var(--ok)">${esc(x.q.dobra)}</b></div>`).join("")}</div>` : `<div class="card center"><h2>Bez błędów – brawo! 👏</h2></div>`}
    <button class="btn wide" onclick="home()">Wróć do testów</button>`;
  window.scrollTo(0, 0);
  // szacunek nagrody (do karty „Czeka na komputer” w Mój czas) – prawdziwą liczy komputer
  const fast = T.ans.filter((a, i) => a.odp === T.qs[i].dobra && a.ms < WAIT_MS).length;
  let szac = proc < K.prog ? 0 : Math.max(0, (ok - fast) * K.sekundy - (n - ok) * (K.minus || 0));
  if (szac > 0 && ok === n && fast === 0 && !T.tryb) szac += (K.komplet || 0) * 60;
  const body = JSON.stringify({ test: T.id, czas: Date.now(), odpowiedzi: T.ans, tryb: T.tryb, szac });
  let name = null;
  for (let i = 0; i < 3 && !name; i++) {
    try { const r = await fetch(url("wyniki"), { method: "POST", body }); if (r.ok) name = (await r.json()).name; } catch (e) {}
    if (!name) await new Promise(r => setTimeout(r, 2000));
  }
  if (!name) { $("#rw").textContent = "Nie udało się wysłać wyniku 😕"; $("#rwi").textContent = "Sprawdź internet i rozwiąż test jeszcze raz."; return; }
  $("#rw").innerHTML = `<span class="spin"></span>Komputer dolicza czas…`;
  const t0 = Date.now();
  while (Date.now() - t0 < 120000) {
    await new Promise(r => setTimeout(r, 3000));
    let w = null;
    try { w = await getJson(url("wyniki/" + name)); } catch (e) {}
    if (w && w.przyznano != null) {
      const el = $("#rw"); if (!el) return;
      el.style.color = w.przyznano > 0 ? "var(--ok)" : "var(--m)";
      el.textContent = w.przyznano > 0 ? `+${fmtSec(w.przyznano)} dodane 🎉` : "Tym razem bez nagrody";
      $("#rwi").textContent = w.info || "";
      return;
    }
  }
  const el = $("#rw"); if (!el) return;
  el.style.color = "var(--m)";
  el.textContent = "Wynik zapisany ✔";
  $("#rwi").textContent = "Komputer jest wyłączony albo śpi – czas doliczy się sam, gdy go włączysz (wynik czeka do 3 dni).";
}

home();
</script>
</body>
</html>
